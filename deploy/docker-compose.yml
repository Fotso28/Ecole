# Déploiement sur un VPS : PostgreSQL, Redis, migrations, API, worker, site, Nginx.
# Usage : cp .env.example .env (puis compléter), docker compose up -d
name: ecole

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecole}
      POSTGRES_USER: ${POSTGRES_USER:-ecole}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: ${API_IMAGE:-ecole-api:latest}
    command: ['node_modules/.bin/prisma', 'migrate', 'deploy']
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    image: ${API_IMAGE:-ecole-api:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: '4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    image: ${API_IMAGE:-ecole-api:latest}
    restart: unless-stopped
    command: ['node', '--enable-source-maps', 'dist/worker.js']
    env_file: .env
    environment:
      NODE_ENV: production
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:-ecole-web:latest}
    restart: unless-stopped
    environment:
      API_URL: http://api:4000
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      # http : premier démarrage et obtention du certificat ; https : production.
      - ./nginx/${NGINX_MODE:-http}.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/locations.conf:/etc/nginx/snippets/ecole-locations.conf:ro
      - certs:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - web
      - api

  # Stockage de fichiers compatible S3 (facultatif) : docker compose --profile minio up -d
  # Alternative hébergée : OVH Object Storage (voir docs/exploitation.md).
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ['minio']
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-ecole}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?définir S3_SECRET_ACCESS_KEY}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: ['minio']
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      [
        '/bin/sh',
        '-c',
        'mc alias set ecole http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" && mc mb --ignore-existing "ecole/$$S3_BUCKET" && mc anonymous set none "ecole/$$S3_BUCKET"',
      ]
    env_file: .env
    restart: 'no'

  certbot:
    image: certbot/certbot:v3.1.0
    profiles: ['tls']
    volumes:
      - certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint:
      [
        '/bin/sh',
        '-c',
        'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done',
      ]

volumes:
  miniodata:
  pgdata:
  redisdata:
  certs:
  certbot-www:
