# Déploiement sur un VPS : PostgreSQL, Redis, migrations, API, worker, site, Nginx.
# Usage : cp .env.example .env (puis compléter), docker compose up -d
name: ecole

# Rotation des journaux Docker (JSON) : 5 fichiers de 10 Mo au plus par service.
x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILES:-5}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecole}
      POSTGRES_USER: ${POSTGRES_USER:-ecole}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: ${API_IMAGE:-ecole-api:latest}
    command: ['node_modules/.bin/prisma', 'migrate', 'deploy']
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    logging: *logging

  api:
    image: ${API_IMAGE:-ecole-api:latest}
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: '4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    image: ${API_IMAGE:-ecole-api:latest}
    restart: unless-stopped
    logging: *logging
    command: ['node', '--enable-source-maps', 'dist/worker.js']
    env_file: .env
    environment:
      NODE_ENV: production
      ALERT_HEALTH_URL: ${ALERT_HEALTH_URL:-http://api:4000/health}
      BACKUP_STATUS_FILE: /backup-status/last-status.json
    volumes:
      - ./backup-status:/backup-status:ro
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:-ecole-web:latest}
    restart: unless-stopped
    logging: *logging
    environment:
      API_URL: http://api:4000
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      # http : premier démarrage et obtention du certificat ; https : production.
      - ./nginx/${NGINX_MODE:-http}.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/locations.conf:/etc/nginx/snippets/ecole-locations.conf:ro
      - certs:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - web
      - api

  certbot:
    image: certbot/certbot:v3.1.0
    profiles: ['tls']
    logging: *logging
    volumes:
      - certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint:
      [
        '/bin/sh',
        '-c',
        'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done',
      ]

volumes:
  pgdata:
  redisdata:
  certs:
  certbot-www:
