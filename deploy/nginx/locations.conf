# Règles communes HTTP et HTTPS.
client_max_body_size 10m;
gzip on;
gzip_comp_level 5;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

location /.well-known/acme-challenge/ {
  root /var/www/certbot;
}

# Outils de développement et documentation : jamais exposés.
location /api/dev/ { return 404; }
location /api/docs { return 404; }

location /api/auth/ {
  limit_req zone=ecole_auth burst=10 nodelay;
  proxy_pass http://api:4000/auth/;
}

# Paiements du portail et de la caisse (encaissement, annulation).
location ~ ^/api/(portal/payments|finance/payments)(/[^/]+/reverse)?$ {
  limit_req zone=ecole_api burst=60 nodelay;
  limit_req zone=ecole_pay_ip burst=30 nodelay;
  limit_req zone=ecole_pay_user burst=10 nodelay;
  rewrite ^/api/(.*)$ /$1 break;
  proxy_pass http://api:4000;
}

# Confirmations des opérateurs Mobile Money.
location /api/webhooks/ {
  limit_req zone=ecole_webhooks burst=60 nodelay;
  proxy_pass http://api:4000/webhooks/;
}

location /api/ {
  limit_req zone=ecole_api burst=60 nodelay;
  proxy_pass http://api:4000/;
}

location /_next/static/ {
  proxy_pass http://web:3000;
  expires 1y;
  add_header Cache-Control "public, immutable";
}

location / {
  proxy_pass http://web:3000;
}
