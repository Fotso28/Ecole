# Déploiement sur un VPS : PostgreSQL, Redis, migrations, API, worker, site, Nginx.
# Usage : cp .env.example .env (puis compléter), docker compose up -d
name: ecole

# Rotation des journaux Docker (JSON) : 5 fichiers de 10 Mo au plus par service.
x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILES:-5}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecole}
      POSTGRES_USER: ${POSTGRES_USER:-ecole}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD}
      # Rôle applicatif ecole_app (soumis à la Row-Level Security), créé au premier démarrage.
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?définir POSTGRES_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  # Migrations avec le rôle propriétaire (MIGRATION_DATABASE_URL), puis droits du rôle applicatif.
  migrate:
    image: ${API_IMAGE:-ecole-api:latest}
    command:
      [
        'sh',
        '-c',
        'node_modules/.bin/prisma migrate deploy && node_modules/.bin/prisma db execute --url "$$MIGRATION_DATABASE_URL" --file prisma/app-role-grants.sql',
      ]
    env_file: .env
    environment:
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER:-ecole}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ecole}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    logging: *logging

  api:
    image: ${API_IMAGE:-ecole-api:latest}
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: '4000'
      # L'API n'a que le rôle applicatif : le mot de passe propriétaire ne lui est pas transmis.
      POSTGRES_PASSWORD: ''
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    image: ${API_IMAGE:-ecole-api:latest}
    restart: unless-stopped
    logging: *logging
    command: ['node', '--enable-source-maps', 'dist/worker.js']
    env_file: .env
    environment:
      NODE_ENV: production
      POSTGRES_PASSWORD: ''
      ALERT_HEALTH_URL: ${ALERT_HEALTH_URL:-http://api:4000/health}
      BACKUP_STATUS_FILE: /backup-status/last-status.json
    volumes:
      - ./backup-status:/backup-status:ro
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:-ecole-web:latest}
    restart: unless-stopped
    logging: *logging
    environment:
      API_URL: http://api:4000
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      # http : premier démarrage et obtention du certificat ; https : production.
      - ./nginx/${NGINX_MODE:-http}.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/locations.conf:/etc/nginx/snippets/ecole-locations.conf:ro
      - certs:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - web
      - api

  # Stockage de fichiers compatible S3 (facultatif) : docker compose --profile minio up -d
  # Alternative hébergée : OVH Object Storage (voir docs/exploitation.md).
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ['minio']
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-ecole}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?définir S3_SECRET_ACCESS_KEY}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: ['minio']
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      [
        '/bin/sh',
        '-c',
        'mc alias set ecole http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" && mc mb --ignore-existing "ecole/$$S3_BUCKET" && mc anonymous set none "ecole/$$S3_BUCKET"',
      ]
    env_file: .env
    restart: 'no'

  certbot:
    image: certbot/certbot:v3.1.0
    profiles: ['tls']
    logging: *logging
    volumes:
      - certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint:
      [
        '/bin/sh',
        '-c',
        'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done',
      ]

volumes:
  miniodata:
  pgdata:
  redisdata:
  certs:
  certbot-www:
